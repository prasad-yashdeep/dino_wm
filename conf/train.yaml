defaults:
  - _self_
  - env: wall
  - encoder: conv2d
  - action_encoder: proprio
  - decoder: vqvae
  - predictor: conv3d
  - state_quantizer: vector_quantizer
  - action_quantizer: vector_quantizer
  - override hydra/launcher: submitit_slurm

# base path to save model outputs. Checkpoints will be saved to ${ckpt_base_path}/outputs.
ckpt_base_path: ./ # put absolute path here

hydra:
  run:
    dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  # launcher:
  #   submitit_folder: ${hydra.sweep.dir}/.submitit/%j
  #   nodes: 1
  #   tasks_per_node: 1
  #   cpus_per_task: 8
  #   mem_gb: 512
  #   gres: "gpu:h100:1"
  #   timeout_min: 2880
  #   setup: ["export DEBUGVAR=$(scontrol show hostnames $SLURM_JOB_NODELIST)",
  #           export MASTER_ADDR="$(scontrol show hostnames $SLURM_JOB_NODELIST | head -n 1)",
  #           "export MASTER_PORT=$(for port in $(shuf -i 30000-65500 -n 20); do if [[ $(netstat -tupln 2>&1 | grep $port | wc -l) -eq 0 ]] ; then echo $port; break; fi; done;)",]

training:
  seed: 0
  epochs: 100
  batch_size: 32 # should >= nodes * tasks_per_node
  save_every_x_epoch: 1
  reconstruct_every_x_batch: 500
  num_reconstruct_samples: 6
  encoder_lr: 1e-4  # Increased from 1e-6 to help encoder learn diverse features
  decoder_lr: 3e-4
  predictor_lr: 5e-4
  action_encoder_lr: 5e-4
  action_quantizer_lr: 1e-4  # Learning rate for action quantizer
  state_quantizer_lr: 1e-4   # Learning rate for state quantizer
  max_grad_norm: 1.0  # Gradient clipping to prevent instability

  # Learning rate scheduler configuration
  scheduler:
    type: "cosine_with_warmup"  # Options: "cosine_with_warmup", "linear_with_warmup", "cosine", "linear", "step", "exponential", "none", "three_stage"
    warmup_epochs: 5  # Number of warmup epochs (only used for *_with_warmup schedulers)
    warmup_start_lr_factor: 0.01  # Starting LR factor during warmup (e.g., 0.01 means start at 1% of base LR)
    min_lr_factor: 0.0  # Minimum LR factor for cosine schedulers (e.g., 0.1 means min LR is 10% of base LR)
    # For step scheduler
    step_size: 10  # Decay LR every step_size epochs
    gamma: 0.1  # Multiplicative factor for step/exponential decay
    # For three_stage scheduler (single-stage 3-phase training)
    stage1_end: 30  # End epoch of Stage 1 (continuous representations)
    stage2_end: 50  # End epoch of Stage 2 (quantizer learning)
    stage3_encoder_lr: null  # Stage 3 encoder LR (defaults to base_lr * 0.05 if null)

img_size: 224 # should be a multiple of 224
frameskip: 5
concat_dim: 1

normalize_action: True

# action encoder
action_emb_dim: 10
num_action_repeat: 1

num_hist: 1
num_pred: 1 # only supports 1
has_predictor: True # set this to False for only training a decoder
has_decoder: True # set this to False for only training a predictor

model:
  _target_: models.visual_world_model.VWorldModel
  image_size: ${img_size}
  num_hist: ${num_hist}
  num_pred: ${num_pred}
  train_encoder: True
  train_predictor: True
  train_decoder: True
  vcreg_loss_weight: 1.0
  quantization_loss_weight: 1.0

# Quantization settings
quantize: True  # Set to False to disable quantization
state_vocabulary_size: 128
action_vocabulary_size: 128

debug: False
disable_wandb: False
force_restart: False  # Set to True to ignore existing checkpoints and start fresh
resume_from: null     # Path to checkpoint directory to resume from (e.g., outputs/2025-10-18/18-45-02)

# Planning params for planning eval jobs launched during training
plan_settings: 
  # plan_cfg_path: conf/plan.yaml # set to null for no planning evals
  plan_cfg_path: null 
  planner: ['gd', 'cem']
  goal_source: ['dset', 'random_state']
  goal_H: [5]
  alpha: [0.1, 1]